---
# roles/log_results/tasks/main.yml
# Aggregate and log final registration results summary, then email all failures

- name: "Append summary report header to log file"
  ansible.builtin.blockinfile:
    path: "{{ registration_log_path }}"
    marker: "# {mark} SUMMARY REPORT {{ job_timestamp }}"
    block: |
      ========================================
      Registration Summary - {{ job_timestamp }}
      Organization: {{ satellite_org }}
      ========================================
    create: true
    mode: '0644'
  delegate_to: localhost

- name: "Count successful registrations"
  ansible.builtin.shell:
    cmd: "grep 'SUCCESS:' {{ registration_log_path }} | wc -l"
  register: success_count
  delegate_to: localhost
  changed_when: false
  failed_when: false

- name: "Count failed registrations"
  ansible.builtin.shell:
    cmd: "grep 'FAILED:' {{ registration_log_path }} | wc -l"
  register: failed_count
  delegate_to: localhost
  changed_when: false
  failed_when: false

- name: "Append summary statistics to log file"
  ansible.builtin.lineinfile:
    path: "{{ registration_log_path }}"
    line: "{{ item }}"
    create: true
    mode: '0644'
  loop:
    - "Successful: {{ success_count.stdout | default('0') }}"
    - "Failed: {{ failed_count.stdout | default('0') }}"
    - "========================================"
  delegate_to: localhost

- name: "Display log file location"
  ansible.builtin.debug:
    msg: "Registration log: {{ registration_log_path }}"

- name: "Read failed hosts file if it exists"
  ansible.builtin.slurp:
    src: "{{ failed_hosts_path }}"
  register: failed_hosts_file
  delegate_to: localhost
  failed_when: false

- name: "Send combined failure report email"
  community.general.mail:
    host: "{{ smtp_host }}"
    port: 25
    from: "{{ notification_email_from }}"
    to: "{{ notification_email_to }}"
    subject: "Satellite Migration - Failures Report - {{ satellite_org }} - {{ job_timestamp }}"
    body: |
      Satellite 6.14 to 6.18 Migration - Failure Report
      ===================================================
      Timestamp: {{ job_timestamp }}
      Organization: {{ satellite_org }}

      Offline Hosts - port 22 not reachable ({{ offline_hosts | default([]) | length }}):
      {% if offline_hosts | default([]) | length > 0 %}
      {% for host in offline_hosts %}
      - {{ host }}
      {% endfor %}
      {% else %}
      None
      {% endif %}

      SSH Auth or Disconnect Failures - port open but login failed ({{ ssh_failed_hosts | default([]) | length }}):
      {% if ssh_failed_hosts | default([]) | length > 0 %}
      {% for host in ssh_failed_hosts %}
      - {{ host }}
      {% endfor %}
      {% else %}
      None
      {% endif %}

      Registration Failures - reached host but registration script failed:
      {% if failed_hosts_file.content is defined %}
      {{ failed_hosts_file.content | b64decode }}
      {% else %}
      None
      {% endif %}

      RHEL 6 Hosts - End of Life - Not Migrated ({{ rhel6_hosts | default([]) | length }}):
      {% if rhel6_hosts | default([]) | length > 0 %}
      {% for host in rhel6_hosts %}
      - {{ host }}
      {% endfor %}
      {% else %}
      None
      {% endif %}

      ===================================================
      This is an automated message from AAP job execution.
  delegate_to: localhost
  when: >
    (offline_hosts | default([]) | length > 0) or
    (ssh_failed_hosts | default([]) | length > 0) or
    (failed_hosts_file.content is defined) or
    (rhel6_hosts | default([]) | length > 0)