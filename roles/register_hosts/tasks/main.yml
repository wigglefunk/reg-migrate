---
# roles/register_hosts/tasks/main.yml
# Execute registration script on each host using activation key based on RHEL major version
# Note: Registration script handles unregistering from old Satellite automatically
# Note: SSH authentication handled automatically by AAP Machine Credential
# Note: Facts gathered at play level provide ansible_distribution_major_version

- name: "Inherit job_timestamp from localhost"
  ansible.builtin.set_fact:
    job_timestamp: "{{ hostvars['localhost']['job_timestamp'] }}"

- name: "DIAGNOSTIC: Verify SSH connection to actual host (not runner)"
  ansible.builtin.shell:
    cmd: "hostname && cat /etc/os-release | grep -E '^(NAME|VERSION)'"
  register: host_diagnostic
  changed_when: false

- name: "DIAGNOSTIC: Display actual host information"
  ansible.builtin.debug:
    msg:
      - "Target hostname from command: {{ host_diagnostic.stdout_lines[0] }}"
      - "Ansible thinks this is: {{ inventory_hostname }}"
      - "OS Info: {{ host_diagnostic.stdout_lines[1:] }}"
      - "Ansible gathered facts say: {{ ansible_distribution }} {{ ansible_distribution_version }}"

- name: "Display detected RHEL version"
  ansible.builtin.debug:
    msg: "Host {{ inventory_hostname }} is running RHEL {{ ansible_distribution_major_version }}"

- name: "Build registration command key based on RHEL version"
  ansible.builtin.set_fact:
    reg_cmd_key: "rhel-{{ ansible_distribution_major_version }}"

- name: "Select registration command for this host"
  ansible.builtin.set_fact:
    host_registration_command: "{{ hostvars['localhost']['registration_commands'][reg_cmd_key] }}"

- name: "Determine if registration command is missing for this RHEL version"
  ansible.builtin.set_fact:
    reg_cmd_missing: "{{ not (host_registration_command is defined and host_registration_command | length > 0) }}"

- name: "Log missing registration command to registration log"
  ansible.builtin.lineinfile:
    path: "{{ registration_log_path }}"
    line: "[{{ job_timestamp }}] FAILED: {{ inventory_hostname }} - no registration command found for {{ reg_cmd_key }}"
    create: true
    mode: '0644'
  delegate_to: localhost
  when: reg_cmd_missing

- name: "Record missing registration command to failed hosts file"
  ansible.builtin.lineinfile:
    path: "{{ failed_hosts_path }}"
    line: "{{ inventory_hostname }} - no registration command found for {{ reg_cmd_key }}"
    create: true
    mode: '0644'
  delegate_to: localhost
  when: reg_cmd_missing

- name: "End host processing if no registration command found"
  ansible.builtin.meta: end_host
  when: reg_cmd_missing

- name: "Generate unique temp script filename"
  ansible.builtin.set_fact:
    temp_script_path: "/tmp/register_to_sat617_{{ inventory_hostname | hash('md5') }}.sh"

- name: "Copy registration script to host"
  ansible.builtin.copy:
    dest: "{{ temp_script_path }}"
    content: |
      #!/bin/bash
      {{ host_registration_command }}
    mode: '0755'
  become: true
  register: copy_result
  failed_when: false

- name: "Log script copy failure to registration log"
  ansible.builtin.lineinfile:
    path: "{{ registration_log_path }}"
    line: "[{{ job_timestamp }}] FAILED: {{ inventory_hostname }} - script copy failed - {{ copy_result.msg | default('unknown error') }}"
    create: true
    mode: '0644'
  delegate_to: localhost
  when: copy_result is failed

- name: "Record script copy failure to failed hosts file"
  ansible.builtin.lineinfile:
    path: "{{ failed_hosts_path }}"
    line: "{{ inventory_hostname }} - script copy failed - {{ copy_result.msg | default('unknown error') }}"
    create: true
    mode: '0644'
  delegate_to: localhost
  when: copy_result is failed

- name: "End host processing if script copy failed"
  ansible.builtin.meta: end_host
  when: copy_result is failed

- name: "Execute registration script on host"
  ansible.builtin.shell:
    cmd: "{{ temp_script_path }}"
  become: true
  register: registration_result
  failed_when: false

- name: "Get Satellite server from subscription-manager baseurl"
  ansible.builtin.shell:
    cmd: subscription-manager config | grep '   baseurl' | awk -F/ '{print $3}'
  become: true
  register: verify_satellite
  changed_when: false
  failed_when: false

- name: "Remove temporary registration script"
  ansible.builtin.file:
    path: "{{ temp_script_path }}"
    state: absent
  become: true

- name: "Log successful registration"
  ansible.builtin.lineinfile:
    path: "{{ registration_log_path }}"
    line: "[{{ job_timestamp }}] SUCCESS: {{ inventory_hostname }} (RHEL {{ ansible_distribution_major_version }}) registered to {{ new_satellite_fqdn }} using Smart Proxy ID {{ primary_smart_proxy_name }}"
    create: true
    mode: '0644'
  delegate_to: localhost
  when: registration_result.rc == 0

- name: "Log failed registration to registration log"
  ansible.builtin.lineinfile:
    path: "{{ registration_log_path }}"
    line: "[{{ job_timestamp }}] FAILED: {{ inventory_hostname }} (RHEL {{ ansible_distribution_major_version }}) registration failed - {{ registration_result.stderr | default('unknown error') }}"
    create: true
    mode: '0644'
  delegate_to: localhost
  when: registration_result.rc != 0

- name: "Record registration failure to failed hosts file"
  ansible.builtin.lineinfile:
    path: "{{ failed_hosts_path }}"
    line: "{{ inventory_hostname }} - registration script failed - {{ registration_result.stderr | default('unknown error') }}"
    create: true
    mode: '0644'
  delegate_to: localhost
  when: registration_result.rc != 0