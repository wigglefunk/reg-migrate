---
# dev_reg.yml
# Satellite 6.14 -> 6.18 Host Re-Registration Orchestration
# Designed for AAP execution with Machine Credential attached
#
# AAP Requirements:
#   - Satellite API Credential (provides app_username/app_password)
#   - Machine Credential (provides ansible_user/ansible_password/ansible_ssh_private_key_file)
#   - Survey input: satellite_org

# ============================================================================
# Play 1: Export and Prepare Host Data
# Runs on localhost - queries Satellite APIs, builds in-memory inventory
# ============================================================================
- name: "Export and Prepare Host Data"
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  collections:
    - redhat.satellite
    - theforeman.foreman
    - community.general
  pre_tasks:
    - name: Validate required survey variables are provided
      ansible.builtin.assert:
        that:
          - satellite_org is defined
          - satellite_org | length > 0
          - app_username is defined
          - app_password is defined
        fail_msg: "Required variables missing. Verify AAP survey inputs and credentials are attached to job template."
        success_msg: "All required variables validated successfully."
    
    - name: Set timestamp for logging 
      ansible.builtin.set_fact: 
        job_timestamp: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S%z') }}" 
        cacheable: true
  roles:
    - export_hosts
    - prepare_import
    - provision_lifecycle_env
    - generate_registration_command
  
  post_tasks:
  - name: "Verify dynamic inventory was successfully built"
    ansible.builtin.assert:
      that:
        - groups['satellite_migration_hosts'] is defined
        - groups['satellite_migration_hosts'] | length > 0
        - groups['satellite_migration_hosts'] | length == (exported_hosts | length)
      fail_msg: "Dynamic inventory validation failed. Expected {{ exported_hosts | length }} hosts, found {{ groups['satellite_migration_hosts'] | default([]) | length }}"
      success_msg: "Dynamic inventory verified: {{ groups['satellite_migration_hosts'] | length }} hosts ready for registration"

# ============================================================================
# Play 1.5: Test SSH + Sudo Connectivity
# Validates that the AAP Machine Credential can actually reach each host
# and escalate privileges - the exact access path registration needs.
# Hosts that pass are added to 'reachable_hosts' group.
# Hosts that fail are silently skipped (ignore_unreachable: true).
# ============================================================================
- name: "Test SSH and Sudo Connectivity"
  hosts: satellite_migration_hosts
  gather_facts: false
  ignore_unreachable: true
  become: true
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  tasks:
    - name: "Test SSH login and privilege escalation"
      ansible.builtin.ping:

    - name: "Add reachable host to registration group"
      ansible.builtin.group_by:
        key: reachable_hosts

# ============================================================================
# Play 1.6: Identify Unreachable Hosts
# Compares original inventory against reachable_hosts to find failures.
# Unreachable hostnames stored on localhost for the final email in Play 4.
# ============================================================================
- name: "Identify Unreachable Hosts"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  tasks:
    - name: "Identify unreachable hosts"
      ansible.builtin.set_fact:
        unreachable_hosts: >-
          {{
            groups['satellite_migration_hosts'] | default([]) |
            difference(groups['reachable_hosts'] | default([]))
          }}

    - name: "Display connectivity test results"
      ansible.builtin.debug:
        msg:
          - "Reachable: {{ groups['reachable_hosts'] | default([]) | length }}"
          - "Unreachable: {{ unreachable_hosts | length }}"

    - name: "End playbook if no reachable hosts remain"
      ansible.builtin.meta: end_play
      when: groups['reachable_hosts'] | default([]) | length == 0

# ============================================================================
# Play 2: Re-Register Hosts to Satellite 6.18
# Targets only reachable_hosts - unreachable hosts were excluded above
# ============================================================================
- name: "Re-Register Hosts to Satellite 6.18"
  hosts: reachable_hosts
  connection: ssh
  become: true
  gather_facts: true
  serial: "{{ batch_size | default(50) }}"
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  collections:
    - redhat.satellite
    - theforeman.foreman
    - community.general
  roles:
    - register_hosts

# ============================================================================
# Play 3: Validate Registration Results
# Targets only reachable_hosts - matches the set we attempted to register
# ============================================================================
- name: "Validate and Log Results"
  hosts: reachable_hosts
  connection: ssh
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  collections:
    - redhat.satellite
    - theforeman.foreman
    - community.general
  roles:
    - validate

# ============================================================================
# Play 4: Generate Final Summary
# ============================================================================
- name: "Generate Final Summary"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  roles:
    - log_results
