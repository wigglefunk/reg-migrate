---
# dev_reg.yml
# Satellite 6.14 -> 6.18 Host Re-Registration Orchestration
# Designed for AAP execution with Machine Credential attached
#
# AAP Requirements:
#   - Satellite API Credential (provides app_username/app_password)
#   - Machine Credential (provides ansible_user/ansible_password/ansible_ssh_private_key_file)
#   - Survey input: satellite_org

# ============================================================================
# Play 1: Export and Prepare Host Data
# Runs on localhost - queries Satellite APIs, builds in-memory inventory
# ============================================================================
- name: "Export and Prepare Host Data"
  hosts: localhost
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  collections:
    - redhat.satellite
    - theforeman.foreman
    - community.general
  pre_tasks:
    - name: Validate required survey variables are provided
      ansible.builtin.assert:
        that:
          - satellite_org is defined
          - satellite_org | length > 0
          - app_username is defined
          - app_password is defined
        fail_msg: "Required variables missing. Verify AAP survey inputs and credentials are attached to job template."
        success_msg: "All required variables validated successfully."
    
    - name: Set timestamp for logging 
      ansible.builtin.set_fact: 
        job_timestamp: "{{ lookup('pipe', 'date +%Y-%m-%dT%H:%M:%S%z') }}" 
        cacheable: true
  roles:
    - export_hosts
    - prepare_import
    - provision_lifecycle_env
    - generate_registration_command
  
  post_tasks:
  - name: "Verify dynamic inventory was successfully built"
    ansible.builtin.assert:
      that:
        - groups['satellite_migration_hosts'] is defined
        - groups['satellite_migration_hosts'] | length > 0
        - groups['satellite_migration_hosts'] | length == (exported_hosts | length)
      fail_msg: "Dynamic inventory validation failed. Expected {{ exported_hosts | length }} hosts, found {{ groups['satellite_migration_hosts'] | default([]) | length }}"
      success_msg: "Dynamic inventory verified: {{ groups['satellite_migration_hosts'] | length }} hosts ready for registration"

# ============================================================================
# Play 1.5: Test SSH + Sudo Connectivity
# Two-stage check: port reachability first, then actual SSH auth + sudo.
# Separates offline hosts from auth/disconnect failures.
# ============================================================================
- name: "Test SSH and Sudo Connectivity"
  hosts: satellite_migration_hosts
  gather_facts: false
  ignore_unreachable: true
  become: true
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  tasks:
    - name: "Check if TCP port 22 is open (network reachability)"
      # ansible.builtin.wait_for - tests port from the controller, not the target
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname }}"
        port: 22
        timeout: 10
        state: started
      delegate_to: localhost
      register: port_check
      ignore_errors: true

    - name: "Test SSH authentication and privilege escalation"
      # Only runs if port 22 is open - isolates auth/disconnect failures
      ansible.builtin.raw: echo ok
      register: ssh_check
      when: port_check is succeeded

    - name: "Group reachable hosts - port open and SSH succeeded"
      ansible.builtin.group_by:
        key: reachable_hosts
      when:
        - port_check is succeeded
        - ssh_check is not skipped
        - ssh_check is succeeded

    - name: "Group offline hosts - port 22 not reachable"
      ansible.builtin.group_by:
        key: offline_hosts
      when: port_check is failed

    - name: "Group SSH failed hosts - port open but auth or disconnect failed"
      ansible.builtin.group_by:
        key: ssh_failed_hosts
      when:
        - port_check is succeeded
        - ssh_check is skipped or ssh_check is failed or ssh_check is unreachable

# ============================================================================
# Play 1.6: Categorize and Store Connectivity Results
# Stores each failure category as a fact on localhost for email reporting.
# ============================================================================
- name: "Categorize Unreachable Hosts"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  tasks:
    - name: "Store offline hosts fact"
      ansible.builtin.set_fact:
        offline_hosts: "{{ groups['offline_hosts'] | default([]) }}"
        cacheable: true

    - name: "Store SSH failed hosts fact"
      ansible.builtin.set_fact:
        ssh_failed_hosts: "{{ groups['ssh_failed_hosts'] | default([]) }}"
        cacheable: true

    - name: "Store combined unreachable hosts for backward compatibility"
      ansible.builtin.set_fact:
        unreachable_hosts: "{{ offline_hosts + ssh_failed_hosts }}"
        cacheable: true

    - name: "Display categorized connectivity results"
      ansible.builtin.debug:
        msg:
          - "Reachable:                   {{ groups['reachable_hosts'] | default([]) | length }}"
          - "Offline (port 22 closed):    {{ offline_hosts | length }}"
          - "SSH auth or disconnect fail: {{ ssh_failed_hosts | length }}"
          - "RHEL 6 skipped:             {{ rhel6_hosts | default([]) | length }}"

    - name: "List offline hosts"
      ansible.builtin.debug:
        msg: "Offline: {{ offline_hosts }}"
      when: offline_hosts | length > 0

    - name: "List SSH failed hosts"
      ansible.builtin.debug:
        msg: "SSH failed: {{ ssh_failed_hosts }}"
      when: ssh_failed_hosts | length > 0

    - name: "End playbook if no reachable hosts remain"
      ansible.builtin.meta: end_play
      when: groups['reachable_hosts'] | default([]) | length == 0

# ============================================================================
# Play 2: Re-Register Hosts to Satellite 6.18
# Targets only reachable_hosts - unreachable hosts were excluded above
# ============================================================================
- name: "Re-Register Hosts to Satellite 6.18"
  hosts: reachable_hosts
  connection: ssh
  become: true
  gather_facts: false
  serial: "{{ batch_size | default(50) }}"
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  collections:
    - redhat.satellite
    - theforeman.foreman
    - community.general
  roles:
    - register_hosts

# ============================================================================
# Play 3: Validate Registration Results
# Targets only reachable_hosts - matches the set we attempted to register
# ============================================================================
- name: "Validate and Log Results"
  hosts: reachable_hosts
  connection: ssh
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  collections:
    - redhat.satellite
    - theforeman.foreman
    - community.general
  roles:
    - validate

# ============================================================================
# Play 4: Generate Final Summary
# ============================================================================
- name: "Generate Final Summary"
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/group_vars/dev.yml"
  roles:
    - log_results
